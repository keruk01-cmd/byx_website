/* ============================================================
   BY X — Black & White portfolio system
   Single file. Optional Supabase back-end for the ADMIN editor.
   ============================================================ */
:root{
  --bg:#ffffff;
  --fg:#000000;
  --mute:#8e8e8e;
  --faint:#d8d8d8;
  --hair:1px;
  --pad:clamp(16px,3.2vw,44px);
  --head-h:clamp(52px,7.2vw,74px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-display:'Anton','Archivo Narrow','Arial Narrow','Oswald',Impact,sans-serif;
  --font-text:'Archivo','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-text);
  font-size:clamp(13px,1.02vw,15px);
  line-height:1.55;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .25s linear,color .25s linear;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}

.mono{font-family:var(--font-mono);font-size:.82em;letter-spacing:.02em}
.mute{color:var(--mute)}

/* ---------- HEADER ---------- */
#top{
  position:fixed;inset:0 0 auto 0;z-index:80;
  height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding-inline:var(--pad);
  background:var(--bg);
  border-bottom:var(--hair) solid var(--fg);
  transition:background .25s linear,color .25s linear;
}
#brand{
  display:flex;align-items:center;gap:0;
  font-family:var(--font-display);
  font-size:clamp(22px,3.5vw,38px);
  line-height:1;letter-spacing:.005em;
  cursor:pointer;user-select:none;flex:0 0 auto;
}
#slotwrap{
  position:relative;display:block;flex:0 0 auto;
  width:clamp(104px,15.5vw,210px);
  height:1.16em;
}
#slot{position:absolute;inset:0;overflow:hidden}
/* the blank line — static: it never moves while the reel spins */
#rule{
  position:absolute;left:0;right:0;bottom:.105em;
  height:.075em;background:currentColor;pointer-events:none;
}
/* soft top/bottom edge only while the reel is moving */
#slot.sp1,#slot.sp2{
  mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%);
}
#slot.sp3{
  mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
}
#slot.sp1{filter:blur(1.6px);opacity:.72;transition:filter .35s linear,opacity .35s linear}
#slot.sp2{filter:blur(.7px);opacity:.88;transition:filter .5s linear,opacity .5s linear}
#slot.sp3{filter:blur(0);opacity:1;transition:filter .45s linear,opacity .45s linear}
#reel{position:absolute;left:0;top:0;width:100%;will-change:transform}
#reel .it{
  height:1.16em;width:100%;
  display:flex;align-items:center;justify-content:flex-end;
  white-space:nowrap;overflow:hidden;
}
#reel .w{flex:0 0 auto;transform-origin:100% 50%}
#brand .fixed{padding-left:.15em;white-space:nowrap}
#brand:active{opacity:.6}

#nav{display:flex;align-items:center;gap:clamp(14px,2.1vw,34px);flex:0 0 auto;margin-left:auto}
#nav a{
  font-family:var(--font-display);
  font-size:clamp(12px,1.32vw,17px);
  letter-spacing:.06em;text-transform:uppercase;
  position:relative;padding-block:4px;
}
#nav a::after{
  content:"";position:absolute;left:0;right:100%;bottom:1px;height:2px;background:var(--fg);
  transition:right .3s var(--ease);
}
#nav a:hover::after,#nav a.on::after{right:0}
#burger{display:none;width:26px;height:16px;position:relative;margin-left:auto}
#burger i{position:absolute;left:0;right:0;height:2px;background:var(--fg);transition:transform .3s var(--ease),opacity .2s}
#burger i:nth-child(1){top:0}
#burger i:nth-child(2){top:7px}
#burger i:nth-child(3){top:14px}
body.menu #burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menu #burger i:nth-child(2){opacity:0}
body.menu #burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

#mobnav{
  position:fixed;inset:var(--head-h) 0 0 0;z-index:70;
  background:var(--bg);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:var(--pad);
  transform:translateY(-101%);transition:transform .5s var(--ease);
  visibility:hidden;
}
body.menu #mobnav{transform:translateY(0);visibility:visible}
#mobnav .links{display:flex;flex-direction:column;gap:2px;margin-top:6vh}
#mobnav .links a{
  font-family:var(--font-display);font-size:clamp(34px,11vw,60px);
  line-height:1.02;text-transform:uppercase;letter-spacing:.01em;
  border-bottom:var(--hair) solid var(--faint);padding-block:.12em;
  display:flex;justify-content:space-between;align-items:baseline;
}
#mobnav .links a span{font-family:var(--font-mono);font-size:11px;color:var(--mute)}
#mobnav .foot{font-family:var(--font-mono);font-size:11px;line-height:1.8;color:var(--mute)}

/* ---------- PAGE SHELL ---------- */
#app{padding-top:var(--head-h);min-height:60vh}
.page{animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sechead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:14px var(--pad);border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:var(--head-h);background:var(--bg);z-index:40;
}
.sechead h2{
  margin:0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(15px,1.7vw,21px);letter-spacing:.06em;text-transform:uppercase;
}
.count{font-family:var(--font-mono);font-size:11px;color:var(--mute)}

.display{font-family:var(--font-display);font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:-.005em;margin:0}
.h-xl{font-size:clamp(44px,11.5vw,168px)}
.h-l{font-size:clamp(30px,6vw,74px)}
.h-m{font-size:clamp(20px,2.9vw,38px)}
.blank{display:inline-block;width:1.42em;height:.072em;background:currentColor;vertical-align:.055em;margin-right:.04em}
.blk-row{display:block;margin:0 0 .12em}

.hero{padding:clamp(28px,6vw,80px) var(--pad) clamp(24px,4vw,54px);border-bottom:var(--hair) solid var(--fg)}
.hero .lede{max-width:60ch;margin-top:clamp(18px,2.6vw,34px);font-size:clamp(13px,1.25vw,17px);line-height:1.62}
.tag{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border:var(--hair) solid var(--fg);padding:4px 8px;line-height:1;white-space:nowrap;
  transition:background .18s,color .18s;
}
button.tag:hover,a.tag:hover{background:var(--fg);color:var(--bg)}

/* ---------- PROJECT ---------- */
.pbar{
  display:flex;align-items:center;justify-content:flex-end;gap:14px;
  padding:11px var(--pad);border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:var(--head-h);background:var(--bg);z-index:45;
}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0;flex:1 1 auto}
.chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  border:var(--hair) solid var(--fg);padding:4px 8px;line-height:1;white-space:nowrap;
  transition:background .18s,color .18s;
}
.chip:hover,.chip.on{background:var(--fg);color:var(--bg)}
.toggle{display:flex;border:var(--hair) solid var(--fg);flex:0 0 auto}
.toggle button{
  padding:9px 13px;line-height:0;display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s;
}
.toggle button+button{border-left:var(--hair) solid var(--fg)}
.toggle button.on{background:var(--fg);color:var(--bg)}
.toggle svg{width:13px;height:13px;display:block}
.toggle svg *{fill:currentColor}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(300px,31vw,520px),1fr));
  gap:var(--hair);background:var(--fg);border-bottom:var(--hair) solid var(--fg);
}
.card{background:var(--bg);display:block;position:relative;overflow:hidden;animation:cardin .5s var(--ease) both}
@keyframes cardin{from{opacity:0}to{opacity:1}}
.card .im{display:block;aspect-ratio:4/3;overflow:hidden;position:relative}
/* thumbnails read as B/W until you point at them */
.card .im img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.02);
  transition:transform .7s var(--ease),filter .5s ease;
}
.card:hover .im img{transform:scale(1.035);filter:grayscale(0) contrast(1)}
.card .cap{padding:14px 16px 18px;display:flex;flex-direction:column;gap:5px}
.card .cap .l1{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.card .cap .nm{font-family:var(--font-display);font-size:clamp(20px,2.15vw,30px);text-transform:uppercase;letter-spacing:.02em;line-height:1.03}
.card .cap .cd{font-family:var(--font-mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.card .cap .l2{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.card .badge{
  display:block;position:absolute;top:0;left:0;background:var(--fg);color:var(--bg);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;padding:4px 9px;line-height:1;
}
/* infinite-scroll sentinel */
#more{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:34px var(--pad);border-bottom:var(--hair) solid var(--fg);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
}
#more i{display:block;width:7px;height:7px;background:currentColor;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}

.tablewrap{border-bottom:var(--hair) solid var(--fg)}
table.idx{width:100%;border-collapse:collapse;min-width:760px}
table.idx th{
  text-align:left;font-family:var(--font-mono);font-weight:400;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  padding:9px 12px;border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:calc(var(--head-h) + var(--pbar-h,42px));background:var(--bg);z-index:30;cursor:pointer;white-space:nowrap;
}
table.idx th:hover{color:var(--fg)}
table.idx th .ar{opacity:0}
table.idx th.sorted .ar{opacity:1}
table.idx td{padding:9px 12px;border-bottom:var(--hair) solid var(--faint);vertical-align:middle;font-size:12.5px;white-space:nowrap}
table.idx tr{cursor:pointer;transition:background .12s}
table.idx tbody tr:hover{background:var(--fg);color:var(--bg)}
table.idx tbody tr:hover td{border-bottom-color:var(--fg)}
table.idx .c-code{font-family:var(--font-mono);font-size:11px}
table.idx .c-name{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.02em}
table.idx .c-dim{color:var(--mute)}
table.idx tbody tr:hover .c-dim{color:var(--bg)}
table.idx .thumbcol{width:54px;min-width:54px}
table.idx .thumb{width:46px;min-width:46px;max-width:none;height:34px;object-fit:cover}
.st{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.07em;border:var(--hair) solid currentColor;padding:2px 6px;line-height:1;white-space:nowrap}

.pd-head{padding:clamp(22px,4vw,54px) var(--pad) clamp(16px,2.4vw,30px);border-bottom:var(--hair) solid var(--fg)}
.pd-head .code{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.pd-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);border-bottom:var(--hair) solid var(--fg)}
.pd-body .txt{padding:clamp(20px,3vw,40px) var(--pad);border-right:var(--hair) solid var(--fg)}
.pd-body .txt p{margin:0 0 1.05em;max-width:56ch;font-size:clamp(13px,1.05vw,15px)}
.specs{padding:clamp(20px,3vw,40px) var(--pad)}
.specs dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.specs dt,.specs dd{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:8px 0;border-bottom:var(--hair) solid var(--faint);margin:0}
.specs dt{color:var(--mute);padding-right:22px;white-space:nowrap}
.specs dd{text-align:right}
.shots{display:grid;grid-template-columns:1fr;gap:var(--hair);background:var(--fg)}
.shots .s{background:var(--bg)}
.shots img{width:100%;height:auto;max-height:82vh;object-fit:cover;display:block}
.pd-nav{display:grid;grid-template-columns:1fr 1fr;border-bottom:var(--hair) solid var(--fg)}
.pd-nav a{padding:clamp(16px,2.4vw,30px) var(--pad);display:flex;flex-direction:column;gap:5px}
.pd-nav a+a{border-left:var(--hair) solid var(--fg);align-items:flex-end;text-align:right}
.pd-nav a:hover{background:var(--fg);color:var(--bg)}
.pd-nav .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--mute)}
.pd-nav a:hover .k{color:var(--bg)}
.pd-nav .v{font-family:var(--font-display);font-size:clamp(18px,2.4vw,30px);text-transform:uppercase;line-height:1}

/* ---------- PAGE HEAD (news / blog / contact) ---------- */
.phead{padding:clamp(26px,5vw,72px) var(--pad) clamp(20px,3vw,40px);border-bottom:var(--hair) solid var(--fg)}
.phead .lede{max-width:58ch;margin:clamp(14px,2vw,26px) 0 0;font-size:clamp(13px,1.2vw,16px);line-height:1.65}
.metaline{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:22px;font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* year divider */
.yeardiv{display:flex;align-items:center;gap:14px;padding:16px var(--pad) 8px}
.yeardiv span{font-family:var(--font-display);font-size:clamp(20px,2.6vw,34px);line-height:1}
.yeardiv i{flex:1 1 auto;height:var(--hair);background:var(--fg);display:block}

/* blog feature */
.feature{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  border-bottom:var(--hair) solid var(--fg);
}
.feature .im{display:block;overflow:hidden;border-right:var(--hair) solid var(--fg);aspect-ratio:16/10}
.feature .im img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.feature:hover .im img{transform:scale(1.03)}
.feature .tx{display:flex;flex-direction:column;padding:clamp(20px,3vw,44px) var(--pad);justify-content:center}
.feature .by{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.feature .ttl{margin:10px 0 12px;display:block}
.feature .sum{max-width:46ch;font-size:clamp(13px,1.1vw,15px);color:var(--mute)}
.feature .tag{align-self:flex-start}
.feature:hover .tag{background:var(--fg);color:var(--bg)}





/* ---------- LIST ---------- */
.rows{border-bottom:var(--hair) solid var(--fg)}
.row-i{
  display:grid;grid-template-columns:120px minmax(0,1fr) 130px;gap:18px;align-items:baseline;
  padding:clamp(13px,1.7vw,22px) var(--pad);
  border-bottom:var(--hair) solid var(--faint);
  transition:background .15s,color .15s;
}
.rows .row-i:last-child{border-bottom:0}
.row-i:hover{background:var(--fg);color:var(--bg)}
.row-i .d{font-family:var(--font-mono);font-size:11px;color:var(--mute)}
.row-i:hover .d,.row-i:hover .k,.row-i:hover .x{color:var(--bg)}
.row-i .t{font-family:var(--font-display);font-size:clamp(17px,2.1vw,27px);text-transform:uppercase;line-height:1.06;letter-spacing:.015em}
.row-i .x{margin-top:5px;font-size:12.5px;color:var(--mute);max-width:70ch}
.row-i .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:right;color:var(--mute)}

.art{max-width:74ch;padding:clamp(26px,4.5vw,64px) var(--pad) clamp(30px,5vw,80px)}
.art h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:clamp(28px,4.6vw,58px);line-height:1.02;margin:.1em 0 .3em}
.art .by{font-family:var(--font-mono);font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.art p{font-size:clamp(13.5px,1.1vw,16px);line-height:1.72;margin:0 0 1.15em}
.art h3{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:clamp(17px,2vw,24px);letter-spacing:.03em;margin:2em 0 .6em}
.art blockquote{margin:1.6em 0;padding-left:18px;border-left:2px solid var(--fg);font-size:clamp(15px,1.5vw,20px);line-height:1.45}
.art figure{margin:1.8em 0}
.art figcaption{font-family:var(--font-mono);font-size:10px;color:var(--mute);margin-top:7px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- ABOUT / CONTACT ---------- */
.about-grid,.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:var(--hair) solid var(--fg)}
.about-grid>div,.contact>div{padding:clamp(20px,3.2vw,44px) var(--pad)}
.about-grid>div+div,.contact>div+div{border-left:var(--hair) solid var(--fg)}
.deflist{display:grid;grid-template-columns:auto minmax(0,1fr)}
.deflist .k,.deflist .v{border-bottom:var(--hair) solid var(--faint);padding:8px 0;font-size:12.5px}
.deflist .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-right:20px;white-space:nowrap}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--hair);background:var(--fg);border-bottom:var(--hair) solid var(--fg)}
.person{background:var(--bg);padding:14px}
.person .im{aspect-ratio:3/4;margin-bottom:9px;overflow:hidden}
.person .im img{width:100%;height:100%;object-fit:cover}
.person .n{font-family:var(--font-display);font-size:17px;text-transform:uppercase;line-height:1}
.person .r{font-family:var(--font-mono);font-size:10px;color:var(--mute);text-transform:uppercase;margin-top:4px}
.bigmail{font-family:var(--font-display);font-size:clamp(22px,3.6vw,48px);text-transform:uppercase;line-height:1.02;word-break:break-all;display:inline-block}
.bigmail:hover{background:var(--fg);color:var(--bg)}
.map{aspect-ratio:16/9;border:var(--hair) solid var(--fg);margin-top:20px;overflow:hidden}
.map img{width:100%;height:100%;object-fit:cover}

/* ---------- FORMS (shared by contact + admin) ---------- */
form.f{display:flex;flex-direction:column;max-width:560px}
label,.flabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:12px;display:block}
input,textarea,select{
  font:inherit;font-size:13px;font-family:var(--font-text);background:transparent;color:var(--fg);
  border:0;border-bottom:var(--hair) solid var(--fg);border-radius:0;
  padding:7px 0 9px;outline:none;width:100%;
}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{border-bottom-width:2px;padding-bottom:8px}
.submit,.abtn{
  border:var(--hair) solid var(--fg);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;line-height:1;transition:background .18s,color .18s;display:inline-block;
}
.submit{margin-top:22px;align-self:flex-start;padding:10px 20px}
.submit:hover,.abtn:hover{background:var(--fg);color:var(--bg)}
.abtn.solid{background:var(--fg);color:var(--bg)}
.abtn.solid:hover{opacity:.72}
.abtn.sm{font-size:9.5px;padding:6px 10px}

/* ---------- ADMIN ---------- */
.adm-bar{
  display:flex;flex-wrap:wrap;align-items:stretch;
  border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:var(--head-h);background:var(--bg);z-index:45;
}
.adm-bar button{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:12px 16px;border-right:var(--hair) solid var(--fg);line-height:1;
}
.adm-bar button.on{background:var(--fg);color:var(--bg)}
.adm-bar .sp{flex:1 1 auto}
.adm-bar .who{font-family:var(--font-mono);font-size:10px;color:var(--mute);display:flex;align-items:center;padding:0 14px;text-transform:uppercase}
.note{
  border:var(--hair) solid var(--fg);padding:12px 14px;
  font-family:var(--font-mono);font-size:10.5px;line-height:1.8;margin:0 0 18px;
}
.note.warn{background:var(--fg);color:var(--bg)}
.note b{letter-spacing:.08em}
.pane{padding:clamp(18px,3vw,34px) var(--pad) 80px;max-width:960px}
.login{max-width:420px}
.arow{
  display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:10px var(--pad);border-bottom:var(--hair) solid var(--faint);
}
.arow:hover{background:rgba(128,128,128,.08)}
.arow .th{width:56px;height:42px;object-fit:cover;border:var(--hair) solid var(--faint)}
.arow .tt{font-family:var(--font-display);font-size:17px;text-transform:uppercase;line-height:1.1}
.arow .mm{font-family:var(--font-mono);font-size:10px;color:var(--mute);text-transform:uppercase;margin-top:3px}
.arow .acts{display:flex;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 22px}
.drop{
  border:1px dashed var(--fg);padding:18px;text-align:center;cursor:pointer;margin-top:8px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
}
.drop:hover,.drop.on{background:var(--fg);color:var(--bg);border-style:solid}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.imgs .cell{position:relative;width:118px}
.imgs img{width:118px;height:86px;object-fit:cover;border:var(--hair) solid var(--faint)}
.imgs .x{position:absolute;top:0;right:0;background:var(--fg);color:var(--bg);font-family:var(--font-mono);font-size:10px;padding:2px 6px;line-height:1.3}
.blocks .b{border:var(--hair) solid var(--faint);padding:10px 12px;margin-bottom:8px}
.blocks .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.blocks .bh .g{display:flex;gap:5px}
.acts-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:16px;border-top:var(--hair) solid var(--fg)}
.acts-bar .right{margin-left:auto}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);
  background:var(--fg);color:var(--bg);padding:11px 20px;z-index:200;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  transition:transform .4s var(--ease),opacity .3s linear;max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;
}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- FOOTER ---------- */
footer{padding:18px var(--pad);border-top:var(--hair) solid var(--fg)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.fbar .lft{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.fbar .adminlink{color:var(--faint)}
.fbar .adminlink:hover{color:var(--fg)}
.fbar .ig{flex:0 0 auto;display:block;line-height:0;padding:2px}
.fbar .ig svg{width:21px;height:21px;display:block;fill:none;stroke:var(--mute);stroke-width:1.7}
.fbar .ig svg .dot{fill:var(--mute);stroke:none}
.fbar .ig:hover svg{stroke:var(--fg)}
.fbar .ig:hover svg .dot{fill:var(--fg)}
@media (max-width:520px){
  .fbar .lft{font-size:9px;gap:8px}
}

/* ---------- MOBILE ---------- */
@media (max-width:880px){
  #nav{display:none}
  #burger{display:block}
  .pd-body{grid-template-columns:1fr}
  .pd-body .txt{border-right:0;border-bottom:var(--hair) solid var(--fg)}
  .about-grid,.contact{grid-template-columns:1fr}
  .about-grid>div+div,.contact>div+div{border-left:0;border-top:var(--hair) solid var(--fg)}
  .row-i{grid-template-columns:1fr;gap:5px}
  .row-i .k{text-align:left}
  .sechead,.pbar,.adm-bar{position:static}
  table.idx th{top:0;position:static}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
  .pbar{flex-wrap:nowrap}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-right:6px}
  .filters::-webkit-scrollbar{display:none}
  .shots img{max-height:64vh}
  .pd-nav .v{font-size:clamp(15px,4.6vw,22px)}
  .arow{grid-template-columns:52px minmax(0,1fr);gap:10px}

/* ============================================================
   0. UTILITIES
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'id' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

function hash32(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed){
  let a = typeof seed === 'string' ? hash32(seed) : seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. PROCEDURAL B/W ARTWORK
   Placeholder art drawn as SVG from a seed. Any record without
   an image falls back to this, so nothing is ever a grey box.
   ============================================================ */
function svgArt(seed, w, h){
  w = w || 1200; h = h || 900;
  const r = rng(String(seed));
  const inv = r() < 0.32;
  const bg = inv ? '#000' : '#fff';
  const fg = inv ? '#fff' : '#000';
  const v  = Math.floor(r() * 6);
  let body = '';
  const R = (a, b) => a + r() * (b - a);

  if (v === 0){
    for (let i = 0; i < 16; i++){
      body += `<rect x="${(R(-.05,.8)*w)|0}" y="${(R(-.05,.8)*h)|0}" width="${(R(.08,.45)*w)|0}" height="${(R(.06,.5)*h)|0}" fill="none" stroke="${fg}" stroke-width="${R(1,3.4).toFixed(1)}"/>`;
    }
    for (let i = 0; i < 5; i++){
      const x = (R(0,1)*w)|0;
      body += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${fg}" stroke-width="1" stroke-dasharray="10 8"/>`;
    }
  } else if (v === 1){
    const n = 60 + (r()*60|0), diag = r() < .5;
    for (let i = 0; i < n; i++){
      const t = i / n, sw = (0.5 + Math.pow(t, 2.1) * 9).toFixed(2);
      if (diag) body += `<line x1="${(t*w*1.6-w*.3)|0}" y1="0" x2="${(t*w*1.6-w*.3-h*.55)|0}" y2="${h}" stroke="${fg}" stroke-width="${sw}"/>`;
      else      body += `<line x1="0" y1="${(t*h)|0}" x2="${w}" y2="${(t*h)|0}" stroke="${fg}" stroke-width="${sw}"/>`;
    }
  } else if (v === 2){
    const cx = (R(.2,.8)*w)|0, cy = (R(.2,.8)*h)|0, n = 12 + (r()*16|0), gy = (h*R(.55,.8))|0;
    for (let i = n; i > 0; i--) body += `<circle cx="${cx}" cy="${cy}" r="${(i/n*Math.max(w,h)*.62)|0}" fill="none" stroke="${fg}" stroke-width="${i%4===0?4:1.2}"/>`;
    body += `<rect x="0" y="${gy}" width="${w}" height="${h}" fill="${bg}"/><line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="${fg}" stroke-width="3"/>`;
  } else if (v === 3){
    let y = 0;
    while (y < h){
      const bh = R(.02,.13)*h;
      if (r() < .45) body += `<rect x="0" y="${y|0}" width="${w}" height="${bh|0}" fill="${fg}"/>`;
      else for (let i = 0, n = 4 + (r()*12|0); i < n; i++)
        body += `<rect x="${(R(0,1)*w)|0}" y="${y|0}" width="${(R(.01,.09)*w)|0}" height="${bh|0}" fill="${fg}"/>`;
      y += bh + R(.008,.035)*h;
    }
  } else if (v === 4){
    for (let i = 0, n = 42; i < n; i++){
      const x = i/n*w*2 - w*.5;
      body += `<line x1="${x|0}" y1="0" x2="${(x-h)|0}" y2="${h}" stroke="${fg}" stroke-width="1.4"/>`;
    }
    const bx = (R(.08,.4)*w)|0, by = (R(.1,.4)*h)|0;
    body += `<rect x="${bx}" y="${by}" width="${(R(.3,.6)*w)|0}" height="${(R(.28,.55)*h)|0}" fill="${fg}"/>`;
    body += `<rect x="${(bx+R(.05,.15)*w)|0}" y="${(by+R(.05,.2)*h)|0}" width="${(R(.06,.16)*w)|0}" height="${(R(.06,.2)*h)|0}" fill="${bg}"/>`;
  } else {
    const cols = 14 + (r()*18|0), rows = Math.round(cols*h/w);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
      const t = (i/cols)*.6 + (j/rows)*.4;
      const rad = Math.max(.4, Math.pow(t,1.8) * (w/cols) * .52);
      body += `<circle cx="${((i+.5)/cols*w)|0}" cy="${((j+.5)/rows*h)|0}" r="${rad.toFixed(1)}" fill="${fg}"/>`;
    }
  }
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="${bg}"/>${body}</svg>`);
}

/* ============================================================
   3. DATA LAYER
   Same API whether we are on Supabase or in demo memory.
   ============================================================ */
let sb = null;           // supabase client (null = demo mode)
let session = null;      // logged-in admin

const DB = {
  projects: [], news: [], posts: [],
  ready: false,

  get demo(){ return !sb; },

  async init(){
    if (CFG.url && CFG.key && window.supabase){
      try{
        sb = window.supabase.createClient(CFG.url, CFG.key);
        const { data } = await sb.auth.getSession();
        session = data ? data.session : null;
        sb.auth.onAuthStateChange((_e, s) => { session = s; });
        await DB.refresh();
        DB.ready = true;
        return;
      }catch(e){ console.warn('[BYX] Supabase 연결 실패 — 데모 모드로 전환합니다.', e); sb = null; }
    }
    DB.projects = SEED_PROJECTS.map(o => ({...o}));
    DB.news     = SEED_NEWS.map(o => ({...o}));
    DB.posts    = SEED_POSTS.map(o => ({...o}));
    DB.ready = true;
  },

  async refresh(){
    if (!sb) return;
    const [p, n, b] = await Promise.all([
      sb.from('projects').select('*').order('sort', {ascending:false}),
      sb.from('news').select('*').order('sort', {ascending:false}),
      sb.from('posts').select('*').order('sort', {ascending:false})
    ]);
    if (p.error || n.error || b.error) throw (p.error || n.error || b.error);
    DB.projects = p.data || [];
    DB.news     = n.data || [];
    DB.posts    = (b.data || []).map(r => ({...r, body: typeof r.body === 'string' ? JSON.parse(r.body) : (r.body || [])}));
  },

  async save(table, row){
    const list = DB[table];
    if (!sb){
      const i = list.findIndex(r => r.id === row.id);
      if (i >= 0) list[i] = {...row}; else list.unshift({...row, id: row.id || uid()});
      return;
    }
    const payload = {...row};
    if (!payload.id) delete payload.id;
    const { error } = await sb.from(table).upsert(payload).select();
    if (error) throw error;
    await DB.refresh();
  },

  async remove(table, id){
    if (!sb){ DB[table] = DB[table].filter(r => r.id !== id); return; }
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) throw error;
    await DB.refresh();
  },

  /* file -> public URL (Supabase Storage) or data-URL (demo) */
  async upload(file){
    if (!sb){
      return await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
    }
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${new Date().getFullYear()}/${uid()}.${ext}`;
    const { error } = await sb.storage.from(CFG.bucket).upload(path, file, {cacheControl:'31536000', upsert:false});
    if (error) throw error;
    return sb.storage.from(CFG.bucket).getPublicUrl(path).data.publicUrl;
  },

  async login(email, pw){
    if (!sb){ session = {user:{email: email || 'demo@byx.kr'}}; return; }
    const { data, error } = await sb.auth.signInWithPassword({email, password: pw});
    if (error) throw error;
    session = data.session;
  },
  async logout(){
    if (sb) await sb.auth.signOut();
    session = null;
  }
};

/* ============================================================
   4. SLOT MACHINE  —  ______BY X
   Landing words: curated design-domain vocabulary (~150).
   Spinning filler: generated live from prefix+root+suffix
   morphemes, so the word pool costs almost no storage.
   ============================================================ */
const LANDING = ('LANDSCAPE OBJECT FURNITURE CHAIR TABLE STOOL BENCH SHELF LAMP HOUSE APT VILLA HOTEL CAFE BAR OFFICE SCHOOL MUSEUM GALLERY LIBRARY CHAPEL PAVILION KIOSK STUDIO KITCHEN BATH CLOSET STAIR FACADE ROOF WALL WINDOW DOOR HANDLE GARDEN PARK PLAZA BRIDGE TOWER CABIN SHELTER MARKET CLINIC ATELIER WORKSHOP FACTORY WAREHOUSE UIUX GRAPHIC PAINT DRAWING GUIDELINE BRAND LOGO POSTER BOOK TYPE FONT GRID LAYOUT PACKAGE SIGNAGE WAYFINDING MAP MODEL MOCKUP PROTOTYPE ICON PATTERN TEXTURE MATERIAL CONCRETE TIMBER STEEL GLASS BRICK STONE PLASTER MORTAR TILE METAL PLAN SECTION ELEVATION AXON DETAIL DIAGRAM MASTERPLAN INTERIOR EXTERIOR EXHIBITION DISPLAY BOOTH STAGE SET LIGHT SHADOW COLOR SURFACE VOLUME MASS VOID THRESHOLD CORRIDOR COURTYARD TERRACE BALCONY ATRIUM LOBBY ARCHIVE CITY BLOCK STREET ALLEY ROOM SPACE PLACE SITE FIELD FRAME MODULE JOINT HINGE RUG CURTAIN MIRROR CLOCK VASE DESK CANOPY FENCE GATE RAMP RAILING COLUMN BEAM SLAB VAULT ARCH TRUSS SKYLIGHT CHIMNEY PORCH ATTIC BASEMENT ROUTE ZONE LAYER STACK CURVE ANGLE EDGE CORE SHELL PANEL MESH NODE PATH').split(' ');

const PRE  = ['','','','','','MICRO','MACRO','NEO','SUB','INTER','HYPER','POST','RE','PROTO','META','MULTI','ULTRA','SEMI','TRANS','ANTI','OVER','UNDER','OUT','NON','PARA','QUASI','PSEUDO','CROSS','COUNTER','HALF'];
const ROOT = ['LAND','FORM','STRUCT','SPACE','SURF','LINE','MASS','FIELD','FRAME','GRID','BLOCK','CRAFT','MAKE','BUILD','DRAW','PRINT','CAST','FOLD','WEAVE','MOUNT','SHIFT','SCALE','MODEL','SIGN','MARK','TONE','GRAIN','EDGE','CORE','SHELL','JOINT','PANEL','TILE','ARCH','VAULT','BEAM','SLAB','TRUSS','MESH','NODE','PATH','ROUTE','ZONE','LAYER','STACK','LOOP','WRAP','CURVE','ANGLE','PLOT','TRACE','SPAN','GROUND','LIGHT','SHADE','SECT','PROJECT','TECT','GRAPH','SCAPE'];
const SUF  = ['','','','','','SCAPE','WORKS','FORM','CRAFT','SPACE','LAB','LINE','BOX','KIT','SET','WARE','ING','ER','FIELD','GRAM','GRAPH','TYPE','SCOPE','MENT','TURE','ION','AGE','ITY','OID','ARIUM'];

function makeWord(){
  const p = PRE[Math.random()*PRE.length|0], r = ROOT[Math.random()*ROOT.length|0], s = SUF[Math.random()*SUF.length|0];
  let w = p + r + s;
  if (w.length < 4)  w = r + 'FORM';
  if (w.length > 11) w = w.slice(0, 11);
  return w;
}
const landingWord = () => LANDING[Math.random()*LANDING.length|0];

const slot = $('#slot'), reel = $('#reel');
let spinning = false, currentWord = '';

function makeItem(word){
  const it = document.createElement('span'); it.className = 'it';
  const w  = document.createElement('span'); w.className = 'w'; w.textContent = word || '';
  it.appendChild(w);
  return it;
}
function fitItems(){
  const box = slot.clientWidth;
  $$('.w', reel).forEach(el => {
    el.style.transform = 'none';
    const w = el.getBoundingClientRect().width;
    if (w > box * .94) el.style.transform = 'scaleX(' + ((box * .94) / w).toFixed(4) + ')';
  });
}
function setStatic(word){
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = '';
  reel.appendChild(makeItem(word));
  currentWord = word || '';
  fitItems();
}

function spin(){
  if (spinning) return;
  const target = landingWord();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ setStatic(target); return; }
  spinning = true;

  const N = 42;
  reel.innerHTML = '';
  reel.appendChild(makeItem(currentWord));
  for (let i = 1; i < N - 1; i++) reel.appendChild(makeItem(makeWord()));
  reel.appendChild(makeItem(target));
  fitItems();

  const ih = reel.firstChild.getBoundingClientRect().height;
  const total = ih * (N - 1);
  const fast  = ih * Math.round((N - 1) * 0.46);
  const dur   = 2700;

  slot.className = 'sp1';
  const anim = reel.animate([
    { transform:'translateY(0)',                              offset:0,    easing:'cubic-bezier(.42,0,.72,.42)' },
    { transform:'translateY(' + (-fast) + 'px)',              offset:0.34, easing:'cubic-bezier(.08,.55,.22,1)' },
    { transform:'translateY(' + (-(total + ih*0.10)) + 'px)', offset:0.93, easing:'cubic-bezier(.33,0,.25,1)' },
    { transform:'translateY(' + (-total) + 'px)',             offset:1 }
  ], { duration: dur, fill:'forwards' });

  setTimeout(() => { slot.className = 'sp2'; }, dur * 0.40);
  setTimeout(() => { slot.className = 'sp3'; }, dur * 0.70);
  anim.onfinish = () => { setStatic(target); anim.cancel(); slot.className = ''; spinning = false; };
}

const app = $('#app');

function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  let page = parts[0] || 'project';
  if (page === 'home') page = 'project';
  return { page, arg: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function render(){
  const { page, arg } = parseHash();
  let html;
  if (page === 'project')      html = arg ? viewProjectDetail(arg) : viewProjects();
  else if (page === 'news')    html = viewNews();
  else if (page === 'blog')    html = arg ? viewPost(arg) : viewBlog();
  else if (page === 'about')   html = viewAbout();
  else if (page === 'contact') html = viewContact();
  else if (page === 'admin')   html = viewAdmin();
  else                         html = viewProjects();

  app.innerHTML = '<div class="page">' + html + '</div>';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  document.body.classList.remove('menu');
  window.scrollTo({top:0, behavior:'instant'});
  document.title = page === 'project' && !arg ? 'BY X — Architecture & Design' : page.toUpperCase() + ' — BY X';
  bindPage(page, arg);
}
window.addEventListener('hashchange', render);

/* load the next batch of cards when the sentinel scrolls into view */
function setupInfinite(list){
  if (IO){ IO.disconnect(); IO = null; }
  const sentinel = $('#more', app);
  if (!sentinel) return;
  IO = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const grid = $('#grid', app);
    if (!grid) return;
    const next = list.slice(PV.shown, PV.shown + BATCH);
    PV.shown += next.length;
    grid.insertAdjacentHTML('beforeend', next.map(cardHTML).join(''));
    if (PV.shown >= list.length){ IO.disconnect(); IO = null; sentinel.remove(); }
  }, { rootMargin: '400px 0px' });
  IO.observe(sentinel);
}

function refreshAdmin(){
  const y = window.scrollY;
  app.innerHTML = '<div>' + viewAdmin() + '</div>';
  bindAdmin();
  window.scrollTo(0, y);
}

function pickFiles(multiple){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multiple;
    i.onchange = () => res(Array.from(i.files || []));
    i.click();
  });
}

async function handleFiles(key, files){
  if (!files.length) return;
  toast('업로드 중…');
  try{
    const urls = [];
    for (const f of files) urls.push(await DB.upload(f));
    if (key === 'img')        AD.draft.img = urls[0];
    else if (key === 'shots') AD.draft.shots = (AD.draft.shots || []).concat(urls);
    else if (key.startsWith('block:')){
      const i = +key.split(':')[1];
      AD.draft.body[i].v = urls[0];
    }
    toast('업로드 완료');
    refreshAdmin();
  }catch(e){ console.error(e); toast('업로드 실패: ' + (e.message || e)); }
}

const blank = t => t === 'projects'
  ? {code:'BYX-', name:'', client:'', type:TYPES[0], loc:'', year:new Date().getFullYear(), status:'IN PROGRESS', area:'', role:'', img:'', shots:[], descr:'', sort:(DB.projects[0]?.sort||1000)+10}
  : t === 'news'
  ? {d:'', k:'PROJECT', t:'', x:'', sort:(DB.news[0]?.sort||1000)+10}
  : {slug:'', d:'', k:'ESSAY', t:'', x:'', body:[], sort:(DB.posts[0]?.sort||1000)+10};

function bindAdmin(){
  const root = app;

  const lf = $('#lform', root);
  if (lf) lf.onsubmit = async e => {
    e.preventDefault();
    try{ await DB.login($('#l-e').value.trim(), $('#l-p').value); AD.tab='projects'; AD.draft=null; refreshAdmin(); }
    catch(err){ toast('로그인 실패: ' + (err.message || err)); }
  };

  $$('[data-tab]', root).forEach(b => b.onclick = () => { AD.tab = b.dataset.tab; AD.draft = null; refreshAdmin(); });
  $$('[data-edit]', root).forEach(b => b.onclick = () => {
    const r = DB[AD.tab].find(x => String(x.id) === b.dataset.edit);
    AD.draft = JSON.parse(JSON.stringify(r)); refreshAdmin();
  });
  $$('[data-del]', root).forEach(b => b.onclick = async () => {
    if (!confirm('정말 삭제할까요? 되돌릴 수 없습니다.')) return;
    try{ await DB.remove(AD.tab, b.dataset.del); toast('삭제됨'); refreshAdmin(); }
    catch(e){ toast('삭제 실패: ' + (e.message||e)); }
  });

  /* field binding — no re-render while typing */
  $$('[data-k]', root).forEach(el => el.oninput = () => {
    const k = el.dataset.k;
    AD.draft[k] = (el.type === 'number') ? (el.value === '' ? null : +el.value) : el.value;
  });
  $$('[data-block]', root).forEach(el => el.oninput = () => {
    const [i, f] = el.dataset.block.split(':');
    AD.draft.body[+i][f] = el.value;
  });

  /* images */
  $$('[data-drop]', root).forEach(z => {
    const key = z.dataset.drop;
    const multi = key === 'shots';
    z.onclick = async () => handleFiles(key, await pickFiles(multi));
    z.ondragover = e => { e.preventDefault(); z.classList.add('on'); };
    z.ondragleave = () => z.classList.remove('on');
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove('on');
      handleFiles(key, Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/')));
    };
  });
  $$('[data-imgdel]', root).forEach(b => b.onclick = () => {
    const [key, i] = b.dataset.imgdel.split(':');
    if (key === 'img') AD.draft.img = '';
    else if (key === 'shots') AD.draft.shots.splice(+i, 1);
    else if (key === 'blockimg') AD.draft.body[+i].v = '';
    refreshAdmin();
  });

  /* blocks */
  $$('[data-badd]', root).forEach(b => b.onclick = () => {
    AD.draft.body = AD.draft.body || [];
    AD.draft.body.push(b.dataset.badd === 'img' ? {t:'img', v:'', c:''} : {t:b.dataset.badd, v:''});
    refreshAdmin();
  });
  $$('[data-bdel]', root).forEach(b => b.onclick = () => { AD.draft.body.splice(+b.dataset.bdel, 1); refreshAdmin(); });
  $$('[data-bmove]', root).forEach(b => b.onclick = () => {
    const [i, dir] = b.dataset.bmove.split(':').map(Number);
    const j = i + dir, arr = AD.draft.body;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    refreshAdmin();
  });

  /* actions */
  $$('[data-act]', root).forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === 'logout'){ await DB.logout(); AD.draft = null; refreshAdmin(); return; }
    if (a === 'new'){ AD.draft = blank(AD.tab); refreshAdmin(); return; }
    if (a === 'cancel'){ AD.draft = null; refreshAdmin(); return; }
    if (a === 'copysql'){
      const txt = $$('.pane > div', root).map(d => d.textContent).pop();
      try{ await navigator.clipboard.writeText(txt); toast('복사됨'); }catch(e){ toast('복사 실패 — 직접 선택해 주세요'); }
      return;
    }
    if (a === 'delete'){
      if (!confirm('정말 삭제할까요?')) return;
      try{ await DB.remove(AD.tab, AD.draft.id); AD.draft = null; toast('삭제됨'); refreshAdmin(); }
      catch(e){ toast('삭제 실패: ' + (e.message||e)); }
      return;
    }
    if (a === 'save'){
      const d = {...AD.draft};
      if (AD.tab === 'projects'){
        if (!d.code || !d.name){ toast('코드와 프로젝트명은 필수입니다'); return; }
        d.year = +d.year || null; d.sort = +d.sort || 0;
      }
      if (AD.tab === 'posts'){
        if (!d.slug){ d.slug = (d.t || 'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid(); }
        d.sort = +d.sort || 0;
      }
      if (AD.tab === 'news'){ d.sort = +d.sort || 0; }
      try{ await DB.save(AD.tab, d); AD.draft = null; toast('저장되었습니다'); refreshAdmin(); }
      catch(e){ console.error(e); toast('저장 실패: ' + (e.message||e)); }
    }
  });
}

/* ============================================================
   8. PAGE BINDINGS
   ============================================================ */
function bindPage(page, arg){
  const bar = $('.pbar', app);
  if (bar) document.documentElement.style.setProperty('--pbar-h', bar.offsetHeight + 'px');

  $$('[data-go]', app).forEach(b => b.onclick = () => { PV.type = b.dataset.go; PV.view = 'grid'; location.hash = '#/'; render(); });

  if (IO && !(page === 'project' && !arg)){ IO.disconnect(); IO = null; }

  if (page === 'project' && !arg){
    if (PV.view === 'grid') setupInfinite(filtered());
    $$('.toggle button', app).forEach(b => b.onclick = () => { PV.view = b.dataset.view; render(); });
    $$('table.idx th[data-sort]', app).forEach(th => th.onclick = () => {
      const k = th.dataset.sort;
      if (PV.sort === k) PV.dir *= -1; else { PV.sort = k; PV.dir = 1; }
      render();
    });
    $$('table.idx tbody tr', app).forEach(tr => tr.onclick = () => { location.hash = '#/project/' + encodeURIComponent(tr.dataset.code); });
  }
  if (page === 'admin') bindAdmin();
}

/* ============================================================
   9. CHROME + BOOT
   ============================================================ */
$('#brand').addEventListener('click', () => {
  spin();
  if (location.hash !== '#/' && location.hash !== '') location.hash = '#/';
});
$('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
$$('#mobnav a').forEach(a => a.addEventListener('click', () => document.body.classList.remove('menu')));
window.addEventListener('resize', () => { if (!spinning) fitItems(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu'); });

(async () => {
  setStatic('');
  app.innerHTML = '<div class="pane"><p class="mono mute">LOADING…</p></div>';
  await DB.init();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitItems);
  setTimeout(() => { if (!spinning) spin(); }, 700);
})();
</script>
