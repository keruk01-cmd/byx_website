/* ============================================================
   BY X — Black & White portfolio system
   Single file. Optional Supabase back-end for the ADMIN editor.
   ============================================================ */
:root{
  --bg:#ffffff;
  --fg:#000000;
  --mute:#8e8e8e;
  --faint:#d8d8d8;
  --hair:1px;
  --pad:clamp(16px,3.2vw,44px);
  --head-h:clamp(74px,10.4vw,108px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-display:'Anton','SUIT Variable','Archivo Narrow','Arial Narrow',Impact,sans-serif;
  --font-text:'SUIT Variable','SUIT','Apple SD Gothic Neo','Malgun Gothic','Helvetica Neue',Arial,sans-serif;
  --font-mono:'SUIT Variable','SUIT','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-text);
  font-size:clamp(13px,1.02vw,15px);
  line-height:1.55;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .25s linear,color .25s linear;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}

.mono{font-family:var(--font-mono);font-size:.82em;letter-spacing:.02em}
.mute{color:var(--mute)}

/* ---------- HEADER ---------- */
#top{
  position:fixed;inset:0 0 auto 0;z-index:80;
  height:var(--head-h);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding-inline:var(--pad);
  background:var(--bg);
  border-bottom:var(--hair) solid var(--fg);
  transition:background .25s linear,color .25s linear;
}
#brand{
  display:flex;align-items:center;gap:0;
  font-family:var(--font-display);
  font-size:clamp(33px,5.25vw,57px);
  line-height:1;letter-spacing:.005em;
  cursor:pointer;user-select:none;flex:0 0 auto;
}
#slotwrap{
  position:relative;display:block;flex:0 0 auto;
  width:clamp(156px,23vw,315px);
  height:1.16em;
}
#slot{position:absolute;inset:0;overflow:hidden}
/* the blank line — static: it never moves while the reel spins */
#rule{
  position:absolute;left:0;right:0;bottom:.105em;
  height:.075em;background:currentColor;pointer-events:none;
}
/* soft top/bottom edge only while the reel is moving */
#slot.sp1,#slot.sp2{
  mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%);
}
#slot.sp3{
  mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);
}
#slot.sp1{filter:blur(1.6px);opacity:.72;transition:filter .35s linear,opacity .35s linear}
#slot.sp2{filter:blur(.7px);opacity:.88;transition:filter .5s linear,opacity .5s linear}
#slot.sp3{filter:blur(0);opacity:1;transition:filter .45s linear,opacity .45s linear}
#reel{position:absolute;left:0;top:0;width:100%;will-change:transform}
#reel .it{
  height:1.16em;width:100%;
  display:flex;align-items:center;justify-content:flex-end;
  white-space:nowrap;overflow:hidden;
}
#reel .w{flex:0 0 auto;transform-origin:100% 50%}
/* the gap before BY is a real space, so it is identical to the one in BY X */
#brand .fixed{padding-left:0;white-space:pre}
#brand:active{opacity:.6}

#nav{display:flex;align-items:center;gap:clamp(14px,2.1vw,34px);flex:0 0 auto;margin-left:auto}
#nav a{
  font-family:var(--font-display);
  font-size:clamp(12px,1.32vw,17px);
  letter-spacing:.06em;text-transform:uppercase;
  position:relative;padding-block:4px;
}
#nav a::after{
  content:"";position:absolute;left:0;right:100%;bottom:1px;height:2px;background:var(--fg);
  transition:right .3s var(--ease);
}
#nav a:hover::after,#nav a.on::after{right:0}
#burger{display:none;width:26px;height:16px;position:relative;margin-left:auto}
#burger i{position:absolute;left:0;right:0;height:2px;background:var(--fg);transition:transform .3s var(--ease),opacity .2s}
#burger i:nth-child(1){top:0}
#burger i:nth-child(2){top:7px}
#burger i:nth-child(3){top:14px}
body.menu #burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menu #burger i:nth-child(2){opacity:0}
body.menu #burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

#mobnav{
  position:fixed;inset:var(--head-h) 0 0 0;z-index:70;
  background:var(--bg);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:var(--pad);
  transform:translateY(-101%);transition:transform .5s var(--ease);
  visibility:hidden;
}
body.menu #mobnav{transform:translateY(0);visibility:visible}
#mobnav .links{display:flex;flex-direction:column;gap:2px;margin-top:6vh}
#mobnav .links a{
  font-family:var(--font-display);font-size:clamp(34px,11vw,60px);
  line-height:1.02;text-transform:uppercase;letter-spacing:.01em;
  border-bottom:var(--hair) solid var(--faint);padding-block:.12em;
  display:flex;justify-content:space-between;align-items:baseline;
}
#mobnav .links a span{font-family:var(--font-mono);font-size:11px;color:var(--mute)}
#mobnav .foot{font-family:var(--font-mono);font-size:11px;line-height:1.8;color:var(--mute)}

/* ---------- PAGE SHELL ---------- */
#app{padding-top:var(--head-h);min-height:60vh}
.page{animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sechead{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:14px var(--pad);border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:var(--head-h);background:var(--bg);z-index:40;
}
.sechead h2{
  margin:0;font-family:var(--font-display);font-weight:400;
  font-size:clamp(15px,1.7vw,21px);letter-spacing:.06em;text-transform:uppercase;
}
.count{font-family:var(--font-mono);font-size:11px;color:var(--mute)}

.display,#brand,#nav a,.row-i .t,.card .cap .nm,.yeardiv span,table.idx .c-name,.art h1,.art h3,
.sechead h2,.person .n,.feature .ttl,.pd-nav .v,.arow .tt{font-variation-settings:'wght' 680}
.display{font-family:var(--font-display);font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:-.005em;margin:0}
.h-xl{font-size:clamp(44px,11.5vw,168px)}
.h-l{font-size:clamp(30px,6vw,74px)}
.h-m{font-size:clamp(20px,2.9vw,38px)}
.blank{display:inline-block;width:1.42em;height:.072em;background:currentColor;vertical-align:.055em;margin-right:.04em}
/* ABOUT masthead: blank line + BY X on a single line, spaced like the logo */
.brandline{white-space:pre}
.brandline .blank{margin-right:0}

.hero{padding:clamp(28px,6vw,80px) var(--pad) clamp(24px,4vw,54px);border-bottom:var(--hair) solid var(--fg)}
.hero .lede{max-width:60ch;margin-top:clamp(18px,2.6vw,34px);font-size:clamp(13px,1.25vw,17px);line-height:1.62}
.tag{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border:var(--hair) solid var(--fg);padding:4px 8px;line-height:1;white-space:nowrap;
  transition:background .18s,color .18s;
}
button.tag:hover,a.tag:hover{background:var(--fg);color:var(--bg)}

/* ---------- PROJECT ---------- */
.pbar{
  display:flex;align-items:center;justify-content:flex-end;gap:14px;
  padding:11px var(--pad);border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:var(--head-h);background:var(--bg);z-index:45;
}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0;flex:1 1 auto}
.chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  border:var(--hair) solid var(--fg);padding:4px 8px;line-height:1;white-space:nowrap;
  transition:background .18s,color .18s;
}
.chip:hover,.chip.on{background:var(--fg);color:var(--bg)}
.toggle{display:flex;border:var(--hair) solid var(--fg);flex:0 0 auto}
.toggle button{
  padding:5px 8px;line-height:0;display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s;
}
.toggle button+button{border-left:var(--hair) solid var(--fg)}
.toggle button.on{background:var(--fg);color:var(--bg)}
.toggle svg{width:10px;height:10px;display:block}
.toggle svg *{fill:currentColor}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(300px,31vw,520px),1fr));
  gap:var(--hair);background:var(--fg);border-bottom:var(--hair) solid var(--fg);
}
.card{background:var(--bg);display:block;position:relative;overflow:hidden;animation:cardin .5s var(--ease) both}
@keyframes cardin{from{opacity:0}to{opacity:1}}
.card .im{display:block;aspect-ratio:4/3;overflow:hidden;position:relative}
/* thumbnails read as B/W until you point at them */
.card .im img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.02);
  transition:transform .7s var(--ease),filter .5s ease;
}
.card:hover .im img{transform:scale(1.035);filter:grayscale(0) contrast(1)}
.card .cap{padding:14px 16px 18px;display:flex;flex-direction:column;gap:5px}
.card .cap .l1{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.card .cap .nm{font-family:var(--font-display);font-size:clamp(20px,2.15vw,30px);text-transform:uppercase;letter-spacing:.02em;line-height:1.03}
.card .cap .cd{font-family:var(--font-mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.card .cap .l2{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.card .badge{
  display:block;position:absolute;top:0;left:0;background:var(--fg);color:var(--bg);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;padding:4px 9px;line-height:1;
}
/* infinite-scroll sentinel */
#more{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:34px var(--pad);border-bottom:var(--hair) solid var(--fg);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
}
#more i{display:block;width:7px;height:7px;background:currentColor;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}

.tablewrap{border-bottom:var(--hair) solid var(--fg)}
table.idx{width:100%;border-collapse:collapse;min-width:760px}
table.idx th{
  text-align:left;font-family:var(--font-mono);font-weight:400;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  padding:9px 12px;border-bottom:var(--hair) solid var(--fg);
  position:sticky;top:calc(var(--head-h) + var(--pbar-h,42px));background:var(--bg);z-index:30;cursor:pointer;white-space:nowrap;
}
table.idx th:hover{color:var(--fg)}

<script>
const CFG = Object.assign({url:'', key:'', bucket:'media'}, window.BYX_CONFIG || {});

/* ============================================================
   0. UTILITIES
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'id' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/* ordering is derived from dates — there is no manual sort field to fill in.
   '2026.07.28' -> 20260728,  {year:2026, month:7} -> 202607                  */
const dnum  = s => { const n = String(s == null ? '' : s).replace(/\D/g, ''); return n ? +n.padEnd(8, '0').slice(0, 8) : 0; };
const ymNum = p => (+p.year || 0) * 100 + (+p.month || 0);
const ymText = p => !p.year ? '—' : (p.month ? p.year + '.' + String(p.month).padStart(2, '0') : String(p.year));
const ymInput = p => !p.year ? '' : p.year + '-' + String(p.month || 1).padStart(2, '0');

/* "KEY | VALUE" per line — how editable list settings are typed in ADMIN */
const pairs = s => String(s == null ? '' : s).split('\n').map(l => l.trim()).filter(Boolean)
  .map(l => { const i = l.indexOf('|'); return i < 0 ? [l, ''] : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; });
const lines = s => String(s == null ? '' : s).split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

function hash32(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed){
  let a = typeof seed === 'string' ? hash32(seed) : seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. PROCEDURAL B/W ARTWORK
   Placeholder art drawn as SVG from a seed. Any record without
   an image falls back to this, so nothing is ever a grey box.
   ============================================================ */
function svgArt(seed, w, h){
  w = w || 1200; h = h || 900;
  const r = rng(String(seed));
  const inv = r() < 0.32;
  const bg = inv ? '#000' : '#fff';
  const fg = inv ? '#fff' : '#000';
  const v  = Math.floor(r() * 6);
  let body = '';
  const R = (a, b) => a + r() * (b - a);

  if (v === 0){
    for (let i = 0; i < 16; i++){
      body += `<rect x="${(R(-.05,.8)*w)|0}" y="${(R(-.05,.8)*h)|0}" width="${(R(.08,.45)*w)|0}" height="${(R(.06,.5)*h)|0}" fill="none" stroke="${fg}" stroke-width="${R(1,3.4).toFixed(1)}"/>`;
    }
    for (let i = 0; i < 5; i++){
      const x = (R(0,1)*w)|0;
      body += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${fg}" stroke-width="1" stroke-dasharray="10 8"/>`;
    }
  } else if (v === 1){
    const n = 60 + (r()*60|0), diag = r() < .5;
    for (let i = 0; i < n; i++){
      const t = i / n, sw = (0.5 + Math.pow(t, 2.1) * 9).toFixed(2);
      if (diag) body += `<line x1="${(t*w*1.6-w*.3)|0}" y1="0" x2="${(t*w*1.6-w*.3-h*.55)|0}" y2="${h}" stroke="${fg}" stroke-width="${sw}"/>`;
      else      body += `<line x1="0" y1="${(t*h)|0}" x2="${w}" y2="${(t*h)|0}" stroke="${fg}" stroke-width="${sw}"/>`;
    }
  } else if (v === 2){
    const cx = (R(.2,.8)*w)|0, cy = (R(.2,.8)*h)|0, n = 12 + (r()*16|0), gy = (h*R(.55,.8))|0;
    for (let i = n; i > 0; i--) body += `<circle cx="${cx}" cy="${cy}" r="${(i/n*Math.max(w,h)*.62)|0}" fill="none" stroke="${fg}" stroke-width="${i%4===0?4:1.2}"/>`;
    body += `<rect x="0" y="${gy}" width="${w}" height="${h}" fill="${bg}"/><line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="${fg}" stroke-width="3"/>`;
  } else if (v === 3){
    let y = 0;
    while (y < h){
      const bh = R(.02,.13)*h;
      if (r() < .45) body += `<rect x="0" y="${y|0}" width="${w}" height="${bh|0}" fill="${fg}"/>`;
      else for (let i = 0, n = 4 + (r()*12|0); i < n; i++)
        body += `<rect x="${(R(0,1)*w)|0}" y="${y|0}" width="${(R(.01,.09)*w)|0}" height="${bh|0}" fill="${fg}"/>`;
      y += bh + R(.008,.035)*h;
    }
  } else if (v === 4){
    for (let i = 0, n = 42; i < n; i++){
      const x = i/n*w*2 - w*.5;
      body += `<line x1="${x|0}" y1="0" x2="${(x-h)|0}" y2="${h}" stroke="${fg}" stroke-width="1.4"/>`;
    }
    const bx = (R(.08,.4)*w)|0, by = (R(.1,.4)*h)|0;
    body += `<rect x="${bx}" y="${by}" width="${(R(.3,.6)*w)|0}" height="${(R(.28,.55)*h)|0}" fill="${fg}"/>`;
    body += `<rect x="${(bx+R(.05,.15)*w)|0}" y="${(by+R(.05,.2)*h)|0}" width="${(R(.06,.16)*w)|0}" height="${(R(.06,.2)*h)|0}" fill="${bg}"/>`;
  } else {
    const cols = 14 + (r()*18|0), rows = Math.round(cols*h/w);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
      const t = (i/cols)*.6 + (j/rows)*.4;
      const rad = Math.max(.4, Math.pow(t,1.8) * (w/cols) * .52);
      body += `<circle cx="${((i+.5)/cols*w)|0}" cy="${((j+.5)/rows*h)|0}" r="${rad.toFixed(1)}" fill="${fg}"/>`;
    }
  }
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="${bg}"/>${body}</svg>`);
}

   Same API whether we are on Supabase or in demo memory.

let sb = null;           // supabase client (null = demo mode)
let session = null;      // logged-in admin

/* ---- image downscaling -------------------------------------------------
   Photos come off a camera at 6000px / 8MB. Nothing on this site is ever
   drawn wider than the viewport, and the largest slot is a full-bleed shot
   on a 2560px (QHD/2K) display — so 2560px on the long edge is the point
   past which extra pixels are invisible. WebP at q0.82 lands a typical
   photo around 300-600KB, roughly a tenth of the original, which keeps the
   Supabase free tier (1GB storage / 5GB egress) comfortable for hundreds of
   images. GIF and SVG are passed through: resampling would break them. */
const IMG_MAX = 2560;
const IMG_Q   = 0.82;

const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB';

let webpOK = null;
function canWebp(){
  if (webpOK === null){
    const c = document.createElement('canvas'); c.width = c.height = 1;
    webpOK = c.toDataURL('image/webp').startsWith('data:image/webp');
  }
  return webpOK;
}

async function shrink(file){
  if (!file || file.shrunk) return file;              // idempotent: upload() calls this too
  if (!file.type || !file.type.startsWith('image/')) return file;
  if (/gif|svg/.test(file.type)) return file;

  let bmp = null;
  try{ bmp = await createImageBitmap(file); }catch(e){ return file; }

  const scale = Math.min(1, IMG_MAX / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = 'high';

  const type = canWebp() ? 'image/webp' : 'image/jpeg';
  if (type === 'image/jpeg'){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }  // JPEG has no alpha
  cx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();

  const blob = await new Promise(r => cv.toBlob(r, type, IMG_Q));
  if (!blob || blob.size >= file.size){ try{ file.shrunk = true; }catch(e){} return file; }

  const base = file.name.replace(/\.[^.]+$/, '') || 'image';
  const out = new File([blob], base + (type === 'image/webp' ? '.webp' : '.jpg'), {type});
  out.shrunk = true;
  return out;
}

const DB = {
  projects: [], news: [], posts: [],
  settings: { about: {...DEFAULT_ABOUT}, contact: {...DEFAULT_CONTACT} },
  ready: false,
  lastError: null,      // why the Supabase connection was refused, if it was
  settingsError: null,  // the `settings` table is optional; note it, do not fail

  get demo(){ return !sb; },

  async init(){
    if (CFG.url && CFG.key && !window.supabase){
      DB.lastError = 'supabase-js 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 광고 차단 확장을 확인하세요.';
    }
    if (CFG.url && CFG.key && window.supabase){
      try{
        sb = window.supabase.createClient(CFG.url, CFG.key);
        const { data } = await sb.auth.getSession();
        session = data ? data.session : null;
        sb.auth.onAuthStateChange((_e, s) => { session = s; });
        await DB.refresh();
        DB.ready = true;
        return;
      }catch(e){
        DB.lastError = (e && (e.message || e.error_description)) || String(e);
        console.warn('[BYX] Supabase 연결 실패 — 데모 모드로 전환합니다.', e);
        sb = null;
      }
    }
    DB.projects = SEED_PROJECTS.map(o => ({...o}));
    DB.news     = SEED_NEWS.map(o => ({...o}));
    DB.posts    = SEED_POSTS.map(o => ({...o}));
    DB.ready = true;
  },

  async refresh(){
    if (!sb) return;
    const [p, n, b] = await Promise.all([
      sb.from('projects').select('*').order('sort', {ascending:false}),
      sb.from('news').select('*').order('sort', {ascending:false}),
      sb.from('posts').select('*').order('sort', {ascending:false})
    ]);
    if (p.error || n.error || b.error) throw (p.error || n.error || b.error);
    DB.projects = p.data || [];
    DB.news     = n.data || [];
    DB.posts    = (b.data || []).map(r => ({...r, body: typeof r.body === 'string' ? JSON.parse(r.body) : (r.body || [])}));
    await DB.loadSettings();
  },

  /* ABOUT / CONTACT copy. Optional table — if it is missing the site keeps
     running on the defaults and only ADMIN mentions the problem. */
  async loadSettings(){
    DB.settings = { about: {...DEFAULT_ABOUT}, contact: {...DEFAULT_CONTACT} };
    if (!sb) return;
    try{
      const { data, error } = await sb.from('settings').select('*');
      if (error){ DB.settingsError = error.message || String(error); return; }
      DB.settingsError = null;
      (data || []).forEach(r => {
        const v = typeof r.v === 'string' ? JSON.parse(r.v) : (r.v || {});
        if (DB.settings[r.k]) DB.settings[r.k] = {...DB.settings[r.k], ...v};
      });
    }catch(e){ DB.settingsError = (e && e.message) || String(e); }
  },

  async saveSettings(key, obj){
    DB.settings[key] = {...obj};
    if (!sb) return;
    const { error } = await sb.from('settings').upsert({k: key, v: obj}).select();
    if (error) throw error;
    await DB.loadSettings();
  },

  async save(table, row){
    const list = DB[table];
    if (!sb){
      const i = list.findIndex(r => r.id === row.id);
      if (i >= 0) list[i] = {...row}; else list.unshift({...row, id: row.id || uid()});
      return;
    }
    const payload = {...row};
    if (!payload.id) delete payload.id;
    const { error } = await sb.from(table).upsert(payload).select();
    if (error) throw error;
    await DB.refresh();
  },

  async remove(table, id){
    if (!sb){ DB[table] = DB[table].filter(r => r.id !== id); return; }
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) throw error;
    await DB.refresh();
  },

  /* file -> public URL (Supabase Storage) or data-URL (demo).
     Everything is shrunk first — see shrink() for the sizing rationale. */
  async upload(raw){
    const file = await shrink(raw);
    if (!sb){
      return await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
    }
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${new Date().getFullYear()}/${uid()}.${ext}`;
    const { error } = await sb.storage.from(CFG.bucket).upload(path, file, {cacheControl:'31536000', upsert:false});
    if (error) throw error;
    return sb.storage.from(CFG.bucket).getPublicUrl(path).data.publicUrl;
  },

  async login(email, pw){
    if (!sb){ session = {user:{email: email || 'demo@byx.kr'}}; return; }
    const { data, error } = await sb.auth.signInWithPassword({email, password: pw});
    if (error) throw error;
    session = data.session;
  },
  async logout(){
    if (sb) await sb.auth.signOut();
    session = null;
  }
};

/* ============================================================
   4. SLOT MACHINE  —  ______BY X
   Landing words: curated design-domain vocabulary (~150).
   Spinning filler: generated live from prefix+root+suffix
   morphemes, so the word pool costs almost no storage.
   ============================================================ */
const LANDING = ('LANDSCAPE OBJECT FURNITURE CHAIR TABLE STOOL BENCH SHELF LAMP HOUSE APT VILLA HOTEL CAFE BAR OFFICE SCHOOL MUSEUM GALLERY LIBRARY CHAPEL PAVILION KIOSK STUDIO KITCHEN BATH CLOSET STAIR FACADE ROOF WALL WINDOW DOOR HANDLE GARDEN PARK PLAZA BRIDGE TOWER CABIN SHELTER MARKET CLINIC ATELIER WORKSHOP FACTORY WAREHOUSE UIUX GRAPHIC PAINT DRAWING GUIDELINE BRAND LOGO POSTER BOOK TYPE FONT GRID LAYOUT PACKAGE SIGNAGE WAYFINDING MAP MODEL MOCKUP PROTOTYPE ICON PATTERN TEXTURE MATERIAL CONCRETE TIMBER STEEL GLASS BRICK STONE PLASTER MORTAR TILE METAL PLAN SECTION ELEVATION AXON DETAIL DIAGRAM MASTERPLAN INTERIOR EXTERIOR EXHIBITION DISPLAY BOOTH STAGE SET LIGHT SHADOW COLOR SURFACE VOLUME MASS VOID THRESHOLD CORRIDOR COURTYARD TERRACE BALCONY ATRIUM LOBBY ARCHIVE CITY BLOCK STREET ALLEY ROOM SPACE PLACE SITE FIELD FRAME MODULE JOINT HINGE RUG CURTAIN MIRROR CLOCK VASE DESK CANOPY FENCE GATE RAMP RAILING COLUMN BEAM SLAB VAULT ARCH TRUSS SKYLIGHT CHIMNEY PORCH ATTIC BASEMENT ROUTE ZONE LAYER STACK CURVE ANGLE EDGE CORE SHELL PANEL MESH NODE PATH').split(' ');

const PRE  = ['','','','','','MICRO','MACRO','NEO','SUB','INTER','HYPER','POST','RE','PROTO','META','MULTI','ULTRA','SEMI','TRANS','ANTI','OVER','UNDER','OUT','NON','PARA','QUASI','PSEUDO','CROSS','COUNTER','HALF'];
const ROOT = ['LAND','FORM','STRUCT','SPACE','SURF','LINE','MASS','FIELD','FRAME','GRID','BLOCK','CRAFT','MAKE','BUILD','DRAW','PRINT','CAST','FOLD','WEAVE','MOUNT','SHIFT','SCALE','MODEL','SIGN','MARK','TONE','GRAIN','EDGE','CORE','SHELL','JOINT','PANEL','TILE','ARCH','VAULT','BEAM','SLAB','TRUSS','MESH','NODE','PATH','ROUTE','ZONE','LAYER','STACK','LOOP','WRAP','CURVE','ANGLE','PLOT','TRACE','SPAN','GROUND','LIGHT','SHADE','SECT','PROJECT','TECT','GRAPH','SCAPE'];
const SUF  = ['','','','','','SCAPE','WORKS','FORM','CRAFT','SPACE','LAB','LINE','BOX','KIT','SET','WARE','ING','ER','FIELD','GRAM','GRAPH','TYPE','SCOPE','MENT','TURE','ION','AGE','ITY','OID','ARIUM'];

function makeWord(){
  const p = PRE[Math.random()*PRE.length|0], r = ROOT[Math.random()*ROOT.length|0], s = SUF[Math.random()*SUF.length|0];
  let w = p + r + s;
  if (w.length < 4)  w = r + 'FORM';
  if (w.length > 11) w = w.slice(0, 11);
  return w;
}
const landingWord = () => LANDING[Math.random()*LANDING.length|0];

const slot = $('#slot'), reel = $('#reel');
let spinning = false, currentWord = '';

function makeItem(word){
  const it = document.createElement('span'); it.className = 'it';
  const w  = document.createElement('span'); w.className = 'w'; w.textContent = word || '';
  it.appendChild(w);
  return it;
}
function fitItems(){
  const box = slot.clientWidth;
  $$('.w', reel).forEach(el => {
    el.style.transform = 'none';
    const w = el.getBoundingClientRect().width;
    if (w > box * .94) el.style.transform = 'scaleX(' + ((box * .94) / w).toFixed(4) + ')';
  });
}
function setStatic(word){
  reel.style.transform = 'translateY(0)';
  reel.innerHTML = '';
  reel.appendChild(makeItem(word));
  currentWord = word || '';
  fitItems();
}

function spin(){
  if (spinning) return;
  const target = landingWord();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ setStatic(target); return; }
  spinning = true;

  const N = 42;
  reel.innerHTML = '';
  reel.appendChild(makeItem(currentWord));
  for (let i = 1; i < N - 1; i++) reel.appendChild(makeItem(makeWord()));
  reel.appendChild(makeItem(target));
  fitItems();

  const ih = reel.firstChild.getBoundingClientRect().height;
  const total = ih * (N - 1);
  const fast  = ih * Math.round((N - 1) * 0.46);
  const dur   = 2700;

  slot.className = 'sp1';
  const anim = reel.animate([
    { transform:'translateY(0)',                              offset:0,    easing:'cubic-bezier(.42,0,.72,.42)' },
    { transform:'translateY(' + (-fast) + 'px)',              offset:0.34, easing:'cubic-bezier(.08,.55,.22,1)' },
    { transform:'translateY(' + (-(total + ih*0.10)) + 'px)', offset:0.93, easing:'cubic-bezier(.33,0,.25,1)' },
    { transform:'translateY(' + (-total) + 'px)',             offset:1 }
  ], { duration: dur, fill:'forwards' });

  setTimeout(() => { slot.className = 'sp2'; }, dur * 0.40);
  setTimeout(() => { slot.className = 'sp3'; }, dur * 0.70);
  anim.onfinish = () => { setStatic(target); anim.cancel(); slot.className = ''; spinning = false; };
}

const app = $('#app');

function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  let page = parts[0] || 'project';
  if (page === 'home') page = 'project';
  return { page, arg: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function render(){
  const { page, arg } = parseHash();
  let html;
  if (page === 'project')      html = arg ? viewProjectDetail(arg) : viewProjects();
  else if (page === 'news')    html = viewNews();
  else if (page === 'blog')    html = arg ? viewPost(arg) : viewBlog();
  else if (page === 'about')   html = viewAbout();
  else if (page === 'contact') html = viewContact();
  else if (page === 'admin')   html = viewAdmin();
  else                         html = viewProjects();

  app.innerHTML = '<div class="page">' + (page === 'admin' ? '' : editBar(page, arg)) + html + '</div>';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  document.body.classList.remove('menu');
  window.scrollTo({top:0, behavior:'instant'});
  document.title = page === 'project' && !arg ? 'BY X — Architecture & Design' : page.toUpperCase() + ' — BY X';
  bindPage(page, arg);
}
window.addEventListener('hashchange', render);

/* Shortcut into ADMIN from the page you are looking at.
   Only rendered while logged in — visitors never see it. */
function editBar(page, arg){
  if (!session) return '';
  let btns = [];
  if (page === 'project' && !arg)
    btns = [['new:projects','+ 새 프로젝트'], ['list:projects','프로젝트 관리']];
  else if (page === 'project'){
    const p = DB.projects.find(x => x.code === arg);
    if (p) btns.push(['one:projects:' + p.id, '이 프로젝트 편집']);
    btns.push(['new:projects','+ 새 프로젝트']);
  }
  else if (page === 'news')
    btns = [['new:news','+ 새 소식'], ['list:news','소식 관리']];
  else if (page === 'blog' && !arg)
    btns = [['new:posts','+ 새 글'], ['list:posts','글 관리']];
  else if (page === 'blog'){
    const p = DB.posts.find(x => x.slug === arg);
    if (p) btns.push(['one:posts:' + p.id, '이 글 편집']);
    btns.push(['new:posts','+ 새 글']);
  }
  else if (page === 'about')   btns = [['set:about','ABOUT 편집']];
  else if (page === 'contact') btns = [['set:contact','CONTACT 편집']];
  else return '';

  return `<div class="editbar">
    <span class="lb">Admin</span>
    ${btns.map(([k,l]) => `<button class="abtn sm" data-ed="${k}">${l}</button>`).join('')}
  </div>`;
}

/* open ADMIN already focused on the thing you were looking at */
function gotoAdmin(spec){
  const [kind, tab, id] = spec.split(':');
  AD.back = location.hash || '#/';
  AD.tab  = tab;
  if (kind === 'new')       AD.draft = blank(tab);
  else if (kind === 'one')  { const r = DB[tab].find(x => String(x.id) === id); AD.draft = r ? JSON.parse(JSON.stringify(r)) : null; }
  else if (kind === 'set')  AD.draft = {...DB.settings[tab]};
  else                      AD.draft = null;
  if (tab === 'posts' && AD.draft) AD.draft.bodyText = bodyToText(AD.draft.body);
  if (location.hash === '#/admin') render(); else location.hash = '#/admin';
}

const BATCH = 6;                 // cards loaded per scroll step
let PV = { view:'grid', sort:'code', dir:-1, shown: BATCH };
let IO = null;                   // scroll observer

function filtered(){
  const list = DB.projects.slice();

/* load the next batch of cards when the sentinel scrolls into view */
function setupInfinite(list){
  if (IO){ IO.disconnect(); IO = null; }
  const sentinel = $('#more', app);
  if (!sentinel) return;
  IO = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const grid = $('#grid', app);
    if (!grid) return;
    const next = list.slice(PV.shown, PV.shown + BATCH);
    PV.shown += next.length;
    grid.insertAdjacentHTML('beforeend', next.map(cardHTML).join(''));
    if (PV.shown >= list.length){ IO.disconnect(); IO = null; sentinel.remove(); }
  }, { rootMargin: '400px 0px' });
  IO.observe(sentinel);
}

/* ---- post body <-> one plain-text field -----------------------------------
   The stored shape stays a block array (that is what the public view reads),
   but the editor is a single field you write straight through, like any blog
   editor. Three marks, all typed inline:
     ## heading        ->  {t:'h'}
     > quote           ->  {t:'q'}
     ![caption](url)   ->  {t:'img'}
   A blank line ends a paragraph. Everything else is a paragraph. */
function bodyToText(body){
  return (body || []).map(b =>
    b.t === 'h'   ? '## ' + b.v :
    b.t === 'q'   ? '> ' + b.v :
    b.t === 'img' ? '![' + (b.c || '') + '](' + b.v + ')' :
    b.v
  ).join('\n\n');
}

function textToBody(txt){
  return String(txt == null ? '' : txt).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => {
    let m;
    if ((m = s.match(/^!\[([\s\S]*?)\]\(([\s\S]+)\)$/))) return {t:'img', v:m[2].trim(), c:m[1].trim()};
    if ((m = s.match(/^##\s*([\s\S]*)$/)))               return {t:'h', v:m[1].trim()};
    if ((m = s.match(/^>\s*([\s\S]*)$/)))                return {t:'q', v:m[1].replace(/\n>\s?/g, '\n').trim()};
    return {t:'p', v:s};
  });
}

function hintFor(msg){
  const m = String(msg).toLowerCase();
  if (m.includes('does not exist') || m.includes('relation') || m.includes('schema cache'))
    return '→ 표가 아직 없습니다. 배포 가이드 3-2 의 SQL 을 Supabase 의 SQL Editor 에서 실행하세요.';
  if (m.includes('invalid api key') || m.includes('jwt') || m.includes('apikey') || m.includes('401'))
    return '→ key 값이 잘못되었습니다. Project Settings > API Keys 의 Publishable key 를 다시 복사하세요.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return '→ 주소(url)가 잘못되었거나 인터넷이 끊겼습니다. https://<프로젝트ID>.supabase.co 형식이 맞는지 확인하세요.';
  if (m.includes('permission') || m.includes('row-level'))
    return '→ 보안 정책이 없습니다. 배포 가이드 3-2 SQL 의 policy 부분을 다시 실행하세요.';
  return '→ 위 메시지를 그대로 복사해서 문의하시면 원인을 짚어드릴 수 있습니다.';
}

function pickFiles(multiple){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.multiple = !!multiple;
    i.onchange = () => res(Array.from(i.files || []));
    i.click();
  });
}

async function handleFiles(key, files){
  if (!files.length) return;
  toast('이미지 정리 중…');
  try{
    const urls = [];
    let before = 0, after = 0;
    for (const f of files){
      const small = await shrink(f);
      before += f.size; after += small.size;
      urls.push(await DB.upload(small));      // already shrunk; upload() no-ops on it
    }
    if (key === 'img')        AD.draft.img = urls[0];
    else if (key === 'map')   AD.draft.map = urls[0];
    else if (key === 'shots') AD.draft.shots = (AD.draft.shots || []).concat(urls);
    toast(after < before ? `업로드 완료 · ${kb(before)} → ${kb(after)}` : '업로드 완료');
    refreshAdmin();
  }catch(e){ console.error(e); toast('업로드 실패: ' + (e.message || e)); }
}

/* upload an image and drop its mark at the caret, without re-rendering
   (a re-render here would throw away the caret and the focus) */
async function insertImageAt(ta){
  const files = await pickFiles(false);
  if (!files.length) return;
  toast('이미지 정리 중…');
  try{
    const f = files[0], small = await shrink(f);
    const url = await DB.upload(small);
    insertAtCaret(ta, `\n\n![](${url})\n\n`);
    toast(small.size < f.size ? `이미지 추가 · ${kb(f.size)} → ${kb(small.size)}` : '이미지 추가');
  }catch(e){ console.error(e); toast('업로드 실패: ' + (e.message || e)); }
}

function insertAtCaret(ta, text){
  const a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
  const pos = a + text.length;
  ta.focus(); ta.setSelectionRange(pos, pos);
  AD.draft.bodyText = ta.value;
}

function bindAdmin(){
  const root = app;

  const lf = $('#lform', root);
  if (lf) lf.onsubmit = async e => {
    e.preventDefault();
    try{ await DB.login($('#l-e').value.trim(), $('#l-p').value); AD.tab='projects'; AD.draft=null; refreshAdmin(); }
    catch(err){ toast('로그인 실패: ' + (err.message || err)); }
  };

  $$('[data-tab]', root).forEach(b => b.onclick = () => {
    AD.tab = b.dataset.tab;
    AD.draft = SETTING_TABS.includes(AD.tab) ? {...DB.settings[AD.tab]} : null;
    refreshAdmin();
  });
  $$('[data-edit]', root).forEach(b => b.onclick = () => {
    const r = DB[AD.tab].find(x => String(x.id) === b.dataset.edit);
    AD.draft = JSON.parse(JSON.stringify(r));
    if (AD.tab === 'posts') AD.draft.bodyText = bodyToText(AD.draft.body);
    refreshAdmin();
  });
  $$('[data-del]', root).forEach(b => b.onclick = async () => {
    if (!confirm('정말 삭제할까요? 되돌릴 수 없습니다.')) return;
    try{ await DB.remove(AD.tab, b.dataset.del); toast('삭제됨'); refreshAdmin(); }
    catch(e){ toast('삭제 실패: ' + (e.message||e)); }
  });

  /* field binding — no re-render while typing */
  $$('[data-k]', root).forEach(el => el.oninput = () => {
    const k = el.dataset.k;
    if (k === 'ym'){                                  // one field, two columns
      const m = String(el.value).match(/^(\d{4})\D(\d{1,2})/);
      AD.draft.year  = m ? +m[1] : (+String(el.value).slice(0,4) || null);
      AD.draft.month = m ? +m[2] : null;
      return;
    }
    AD.draft[k] = (el.type === 'number') ? (el.value === '' ? null : +el.value) : el.value;
  });

  /* post body: insert marks / images at the caret, never re-render */
  const wb = $('#wbody', root);
  if (wb){
    $$('[data-ins]', root).forEach(b => b.onclick = () => {
      if (b.dataset.ins === 'img') return insertImageAt(wb);
      insertAtCaret(wb, b.dataset.ins === 'h' ? '\n\n## ' : '\n\n> ');
    });
    wb.ondragover = e => { e.preventDefault(); wb.classList.add('on'); };
    wb.ondragleave = () => wb.classList.remove('on');
    wb.ondrop = async e => {
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      e.preventDefault(); wb.classList.remove('on');
      toast('이미지 정리 중…');
      try{
        for (const f of files){
          const small = await shrink(f);
          insertAtCaret(wb, `\n\n![](${await DB.upload(small)})\n\n`);
        }
        toast('이미지 추가');
      }catch(err){ console.error(err); toast('업로드 실패: ' + (err.message || err)); }
    };
  }

  /* images */
  $$('[data-drop]', root).forEach(z => {
    const key = z.dataset.drop;
    const multi = key === 'shots';
    z.onclick = async () => handleFiles(key, await pickFiles(multi));
    z.ondragover = e => { e.preventDefault(); z.classList.add('on'); };
    z.ondragleave = () => z.classList.remove('on');
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove('on');
      handleFiles(key, Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/')));
    };
  });
  $$('[data-imgdel]', root).forEach(b => b.onclick = () => {
    const [key, i] = b.dataset.imgdel.split(':');
    if (key === 'img') AD.draft.img = '';
    else if (key === 'map') AD.draft.map = '';
    else if (key === 'shots') AD.draft.shots.splice(+i, 1);
    refreshAdmin();
  });

  /* actions */
  $$('[data-act]', root).forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === 'logout'){ await DB.logout(); AD.draft = null; AD.back = null; refreshAdmin(); return; }
    if (a === 'back'){ const h = AD.back; AD.back = null; AD.draft = null; location.hash = h || '#/'; return; }
    if (a === 'new'){ AD.draft = blank(AD.tab); refreshAdmin(); return; }
    if (a === 'cancel'){ leaveEditor(); return; }
    if (a === 'delete'){
      if (!confirm('정말 삭제할까요?')) return;
      try{ await DB.remove(AD.tab, AD.draft.id); AD.draft = null; toast('삭제됨'); leaveEditor(); }
      catch(e){ toast('삭제 실패: ' + (e.message||e)); }
      return;
    }
    if (a === 'savesettings'){
      try{
        await DB.saveSettings(AD.tab, {...AD.draft});
        toast(DB.demo ? '저장되었습니다 (데모 — 새로고침하면 초기화)' : '저장되었습니다');
        leaveEditor();
      }catch(e){ console.error(e); toast('저장 실패: ' + (e.message||e)); }
      return;
    }
    if (a === 'resetsettings'){
      if (!confirm('편집 중인 내용을 버리고 기본값으로 되돌릴까요?')) return;
      AD.draft = {...(AD.tab === 'about' ? DEFAULT_ABOUT : DEFAULT_CONTACT)};
      refreshAdmin();
      return;
    }
    if (a === 'save'){
      const d = {...AD.draft};
      if (AD.tab === 'projects'){
        if (!d.code || !d.name){ toast('코드와 프로젝트명은 필수입니다'); return; }
        d.year = +d.year || null;
        d.month = +d.month || null;
      }
      if (AD.tab === 'posts'){
        if (!d.slug){ d.slug = (d.t || 'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid(); }
        d.body = textToBody(d.bodyText);
        delete d.bodyText;
      }
      d.sort = AD.tab === 'projects' ? ymNum(d) : dnum(d.d);   // ordering is derived, never typed
      try{ await DB.save(AD.tab, d); AD.draft = null; toast('저장되었습니다'); leaveEditor(); }
      catch(e){ console.error(e); toast('저장 실패: ' + (e.message||e)); }
    }
  });
}

/* ============================================================
   8. PAGE BINDINGS
   ============================================================ */
function bindPage(page, arg){
  const bar = $('.pbar', app);
  if (bar) document.documentElement.style.setProperty('--pbar-h', bar.offsetHeight + 'px');

  $$('[data-go]', app).forEach(b => b.onclick = () => { PV.type = b.dataset.go; PV.view = 'grid'; location.hash = '#/'; render(); });
  $$('[data-ed]', app).forEach(b => b.onclick = () => gotoAdmin(b.dataset.ed));

  if (IO && !(page === 'project' && !arg)){ IO.disconnect(); IO = null; }

  if (page === 'project' && !arg){
    if (PV.view === 'grid') setupInfinite(filtered());
    $$('.toggle button', app).forEach(b => b.onclick = () => { PV.view = b.dataset.view; render(); });
    $$('table.idx th[data-sort]', app).forEach(th => th.onclick = () => {
      const k = th.dataset.sort;
      if (PV.sort === k) PV.dir *= -1; else { PV.sort = k; PV.dir = 1; }
      render();
    });
    $$('table.idx tbody tr', app).forEach(tr => tr.onclick = () => { location.hash = '#/project/' + encodeURIComponent(tr.dataset.code); });
  }
  if (page === 'admin') bindAdmin();
}

/* ============================================================
   9. CHROME + BOOT
   ============================================================ */
$('#brand').addEventListener('click', () => {
  spin();
  if (location.hash !== '#/' && location.hash !== '') location.hash = '#/';
});
$('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
$$('#mobnav a').forEach(a => a.addEventListener('click', () => document.body.classList.remove('menu')));
window.addEventListener('resize', () => { if (!spinning) fitItems(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu'); });

(async () => {
  /* typing  byx.kr/admin  lands here; hand it to the hash router */
  if (/\/admin\/?$/i.test(location.pathname) && !location.hash){
    history.replaceState(null, '', location.origin + '/#/admin');
  }
  setStatic('');
  app.innerHTML = '<div class="pane"><p class="mono mute">LOADING…</p></div>';
  await DB.init();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitItems);
  setTimeout(() => { if (!spinning) spin(); }, 700);
})();
</script>
